<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>پنل مدیریت | فوتبالیا</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #050505;
      color: white;
    }

    header {
      padding: 25px;
      text-align: center;
      background: #0b0b0b;
      border-bottom: 1px solid #292929;
    }

    .logo {
      color: #ffd000;
      font-size: 32px;
      font-weight: bold;
    }

    .container {
      width: min(850px, 92%);
      margin: 35px auto;
    }

    .title {
      color: #ffd000;
      margin-bottom: 25px;
    }

    .panel {
      background: #111;
      border: 1px solid #292929;
      border-radius: 20px;
      padding: 25px;
    }

    label {
      display: block;
      margin: 15px 0 8px;
      color: #ccc;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 14px;
      background: #080808;
      color: white;
      border: 1px solid #333;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #ffd000;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    button {
      margin-top: 20px;
      padding: 14px 25px;
      border: none;
      border-radius: 12px;
      background: #ffd000;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(255, 208, 0, .3);
    }

    .logout {
      background: #222;
      color: white;
      margin-right: 10px;
    }

    .hidden {
      display: none;
    }

    #status {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      display: none;
    }

    .login-box {
      max-width: 500px;
      margin: 70px auto;
    }

    .login-title {
      text-align: center;
      color: #ffd000;
      margin-bottom: 25px;
    }

    .user-info {
      margin-bottom: 20px;
      color: #aaa;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      color: #aaa;
      text-decoration: none;
    }

    .back:hover {
      color: #ffd000;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">⚽ فوتبالیا</div>
  <div>پنل مدیریت</div>
</header>


<!-- ================= LOGIN ================= -->

<div id="loginSection" class="container login-box">

  <div class="panel">

    <h2 class="login-title">🔐 ورود مدیر</h2>

    <label>ایمیل</label>
    <input
      id="email"
      type="email"
      placeholder="ایمیل مدیر"
    >

    <label>رمز عبور</label>
    <input
      id="password"
      type="password"
      placeholder="رمز عبور"
    >

    <button onclick="login()">
      ورود
    </button>

    <div id="loginStatus"></div>

  </div>

</div>


<!-- ================= ADMIN PANEL ================= -->

<div id="adminSection" class="container hidden">

  <h1 class="title">📰 افزودن خبر جدید</h1>

  <div class="panel">

    <div class="user-info">
      👤 وارد شده به عنوان:
      <span id="userEmail"></span>
    </div>

    <label>عنوان خبر</label>

    <input
      id="title"
      type="text"
      placeholder="عنوان خبر را بنویس"
    >


    <label>دسته‌بندی</label>

    <select id="category">
      <option>🔥 مهم</option>
      <option>⚽ فوتبال</option>
      <option>🏆 مسابقات</option>
      <option>👤 نقل‌وانتقالات</option>
      <option>🌍 فوتبال جهان</option>
    </select>


    <label>متن خبر</label>

    <textarea
      id="content"
      placeholder="متن کامل خبر را بنویس..."
    ></textarea>


    <label>لینک تصویر خبر</label>

    <input
      id="image"
      type="url"
      placeholder="لینک تصویر"
    >


    <button onclick="publishNews()">
      🚀 انتشار خبر
    </button>

    <button
      class="logout"
      onclick="logout()"
    >
      خروج
    </button>

    <div id="status"></div>

  </div>

  <a class="back" href="index.html">
    ← بازگشت به فوتبالیا
  </a>

</div>


<script>

  // ================= SUPABASE =================

  const SUPABASE_URL =
    "https://zalrujwcdrpeyibaoxss.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_kfRGV3Ugx0HtFfO_atcU_Q_tsKMm_BB";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ================= LOGIN =================

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const status =
      document.getElementById("loginStatus");


    if (!email || !password) {

      status.style.display = "block";

      status.textContent =
        "❌ ایمیل و رمز عبور را وارد کن.";

      return;
    }


    status.style.display = "block";

    status.textContent =
      "⏳ در حال ورود...";


    const { data, error } =
      await supabaseClient.auth.signInWithPassword({

        email: email,

        password: password

      });


    if (error) {

      status.textContent =
        "❌ ورود ناموفق: " + error.message;

      return;
    }


    await checkAdmin(data.user);

  }


  // ================= CHECK ADMIN =================

  async function checkAdmin(user) {

    const { data, error } =
      await supabaseClient
        .from("admins")
        .select("user_id")
        .eq("user_id", user.id)
        .maybeSingle();


    if (error) {

      document.getElementById("loginStatus").textContent =
        "❌ خطا در بررسی مدیر بودن.";

      await supabaseClient.auth.signOut();

      return;
    }


    if (!data) {

      document.getElementById("loginStatus").style.display =
        "block";

      document.getElementById("loginStatus").textContent =
        "❌ این حساب مدیر نیست.";

      await supabaseClient.auth.signOut();

      return;
    }


    // ورود موفق

    document.getElementById("loginSection")
      .classList.add("hidden");

    document.getElementById("adminSection")
      .classList.remove("hidden");

    document.getElementById("userEmail")
      .textContent = user.email;

  }


  // ================= PUBLISH NEWS =================

  async function publishNews() {

    const title =
      document.getElementById("title").value.trim();

    const category =
      document.getElementById("category").value;

    const content =
      document.getElementById("content").value.trim();

    const image =
      document.getElementById("image").value.trim();

    const status =
      document.getElementById("status");


    if (!title || !content) {

      status.style.display = "block";

      status.textContent =
        "❌ عنوان و متن خبر را وارد کن.";

      return;
    }


    status.style.display = "block";

    status.textContent =
      "⏳ در حال انتشار...";


    const { error } =
      await supabaseClient
        .from("news")
        .insert({

          title: title,

          category: category,

          content: content,

          image_url: image || null,

          is_published: true

        });


    if (error) {

      console.error(error);

      status.textContent =
        "❌ انتشار ناموفق: " + error.message;

      return;
    }


    status.textContent =
      "✅ خبر با موفقیت منتشر شد! 🎉";


    document.getElementById("title").value = "";

    document.getElementById("content").value = "";

    document.getElementById("image").value = "";

  }


  // ================= LOGOUT =================

  async function logout() {

    await supabaseClient.auth.signOut();

    document.getElementById("adminSection")
      .classList.add("hidden");

    document.getElementById("loginSection")
      .classList.remove("hidden");

  }


  // ================= CHECK EXISTING LOGIN =================

  async function checkExistingSession() {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();


    if (session && session.user) {

      await checkAdmin(session.user);

    }

  }


  checkExistingSession();

</script>

</body>
</html>
